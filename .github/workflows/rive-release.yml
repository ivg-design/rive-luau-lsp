name: Rive Luau Extension Release

on:
  push:
    tags: ["rive-v*"]
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: rive-luau-win64
            code-target: [win32-x64, win32-arm64]
          - os: ubuntu-22.04
            artifact-name: rive-luau-linux-x86_64
            code-target: [linux-x64]
          - os: macos-latest
            artifact-name: rive-luau-macos
            code-target: [darwin-x64, darwin-arm64]

    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the C++ language server from source
      - name: Build luau-lsp
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DLSP_STATIC_CRT:BOOL=ON
          cmake --build . --config Release --target Luau.LanguageServer.CLI -j 3

      # Copy the platform binary into the extension
      - name: Copy binary into extension
        shell: bash
        run: |
          mkdir -p extension/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/luau-lsp.exe extension/bin/luau-lsp.exe
          else
            cp build/luau-lsp extension/bin/luau-lsp
            chmod 755 extension/bin/luau-lsp
          fi

      # Also copy into bin/rive/ for CLI users
      - name: Copy binary for CLI
        shell: bash
        run: |
          mkdir -p bin/rive
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/luau-lsp.exe bin/rive/luau-lsp.exe
          else
            cp build/luau-lsp bin/rive/luau-lsp
            chmod 755 bin/rive/luau-lsp
          fi

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      # Publish per-platform VSIX to VS Code Marketplace via Azure PAT
      - name: Publish to VS Code Marketplace
        working-directory: extension
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }} --target ${{ join(matrix.code-target, ' ') }}

      # Create CLI archive for GitHub Releases
      - name: Create CLI archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/luau-lsp.exe dist/luau-lsp.exe
            cp extension/definitions/rive-globals.d.luau dist/
            cp extension/definitions/luau-api-docs.json dist/
            cd dist && 7z a ../rive-luau-cli-${{ matrix.artifact-name }}.zip *
          else
            cp build/luau-lsp dist/
            cp bin/rive/rive-luau-analyze dist/
            cp extension/definitions/rive-globals.d.luau dist/
            cp extension/definitions/luau-api-docs.json dist/
            cd dist && zip -r ../rive-luau-cli-${{ matrix.artifact-name }}.zip *
          fi

      - name: Upload CLI archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rive-luau-cli-${{ matrix.artifact-name }}.zip
